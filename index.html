  const win=K<J?s.g[a]>=J:((s.g[a]>=J&&s.g[a]-s.g[b]>=2)||((c.tb>0||c.jd)&&s.g[a]==J+1));
  if(win)endSet(a);
  else if(s.g[0]==K&&s.g[1]==K){if(c.jd)s.dec=true;else if(c.tb>0)s.tb=true}};
 for(const e of evs){if(s.w!=null)break;const a=e.equipo_que_suma=='A'?0:1,b=1-a;s.p[a]++;
  if(s.stb){if(s.p[a]>=c.stb&&s.p[a]-s.p[b]>=2)endSet(a)}
  else if(s.tb){if(s.p[a]>=c.tb&&s.p[a]-s.p[b]>=2)game(a)}
  else{const md=s.dec?'oro':gm(c);
   if(md=='oro'){if(s.p[a]==4)game(a)}
   else if(s.gold)game(a)
   else if(s.p[a]>=4&&s.p[a]-s.p[b]>=2)game(a)
   else if(md=='estrella'&&s.p[0]==s.p[1]&&s.p[0]>=3){s.dz++;if(s.dz==3)s.gold=true}}}
 return s}
const pts=(s,c=DEF)=>s.tb||s.stb?s.p.join(' / '):(gm(c)!='oro'&&s.p[0]>=3&&s.p[1]>=3)?(s.p[0]==s.p[1]?'40 / 40':s.p[0]>s.p[1]?'Ad / 40':'40 / Ad'):s.p.map(x=>[0,15,30,40][x]).join(' / ');
const txt=(s,c)=>s.sets.map(x=>x.join('-')).join(' ')+(s.sets.length?' | ':'')+s.g.join('-')+' ('+pts(s,c)+')';
function gameTotal(s){return s.sets.reduce((n,x)=>n+(Number(x[0])||0)+(Number(x[1])||0),0)+(Number(s.g[0])||0)+(Number(s.g[1])||0)}
function isGameBoundary(before,after){return gameTotal(after)>gameTotal(before)||after.sets.length>before.sets.length||(!before.tb&&after.tb)||(!before.stb&&after.stb)}
function derivedUndoCheckpoint(evs,c){let last=-1;for(let i=0;i<evs.length-1;i++)if(isGameBoundary(calc(evs.slice(0,i),c),calc(evs.slice(0,i+1),c)))last=i;return last}
function undoCheckpointInfo(evs,c,state){const savedId=state?.undo_checkpoint_event_id??null,savedIndex=savedId==null?-1:evs.findIndex(e=>String(e.id)===String(savedId)),derived=derivedUndoCheckpoint(evs,c),index=Math.max(savedIndex,derived);return{index,id:index>=0?evs[index].id:null,needsSave:index>savedIndex}}
function canUndoScore(s){const checkpoint=s.undoCheckpointId==null?-1:s.evs.findIndex(e=>String(e.id)===String(s.undoCheckpointId));return s.undoReady!==false&&s.evs.length-1>checkpoint}

function tournamentTableData(t,ps,ms){
 const matches=ms.filter(m=>m.fase=='grupos'),groups=[...new Set(matches.map(m=>m.grupo||'A'))].sort();
 if(!matches.length)return '';
 const allDone=matches.every(m=>m.estado=='finalizado');
 const sections=groups.map(g=>{
  const games=matches.filter(m=>(m.grupo||'A')==g),ids=[...new Set(games.flatMap(m=>[m.pareja_a_id,m.pareja_b_id]).filter(Boolean))];
  const rows=ids.map(id=>({id,w:0,played:0,sw:0,sl:0,gw:0,gl:0,hw:0}));
  for(const m of games){if(m.estado!='finalizado'||!m.pareja_ganadora_id)continue;
   const a=rows.find(x=>x.id==m.pareja_a_id),b=rows.find(x=>x.id==m.pareja_b_id);if(!a||!b)continue;
   a.played++;b.played++;if(m.pareja_ganadora_id==a.id)a.w++;else b.w++;
   for(const x of String(m.resultado_sets||'').matchAll(/(\d+)\s*-\s*(\d+)/g)){const x0=+x[1],x1=+x[2];a.sw+=x0>x1?1:0;a.sl+=x0<x1?1:0;b.sw+=x1>x0?1:0;b.sl+=x1<x0?1:0;a.gw+=x0;a.gl+=x1;b.gw+=x1;b.gl+=x0}
  }
  for(const wins of new Set(rows.map(x=>x.w))){const tied=rows.filter(x=>x.w==wins),subset=new Set(tied.map(x=>x.id));
   if(tied.length>1)for(const m of games){if(m.estado!='finalizado'||!subset.has(m.pareja_a_id)||!subset.has(m.pareja_b_id))continue;const r=tied.find(x=>x.id==m.pareja_ganadora_id);if(r)r.hw++}}
  rows.sort((a,b)=>b.w-a.w||b.hw-a.hw||(b.sw-b.sl)-(a.sw-a.sl)||(b.gw-b.gl)-(a.gw-a.gl));
  return {g,rows,games,allDone};
 });
 const final=ms.find(m=>m.fase=='final'),mode=modeOf(t),hasFinalMode=mode=='todos_contra_todos_final';
 const single=sections.length==1?sections[0]:null;
 const topTie=single?.rows.length>2&&single.rows[1].w==single.rows[2].w&&single.rows[1].hw==single.rows[2].hw&&single.rows[1].sw-single.rows[1].sl==single.rows[2].sw-single.rows[2].sl&&single.rows[1].gw-single.rows[1].gl==single.rows[2].gw-single.rows[2].gl;
 return {sections,allDone:matches.every(m=>m.estado=='finalizado'),tieAtCut:topTie,rows:single?.rows||[],mode,hasFinalMode,final};
}

function prepareServiceWorker(){

async function syncPushStatus(){

 pushStatusLoading=true;pushStatusUser=userId;

const vapidBytes=s=>{let b=s.replace(/-/g,'+').replace(/_/g,'/');b+='='.repeat((4-b.length%4)%4);return Uint8Array.from(atob(b),c=>c.charCodeAt(0))};
async function removePushSubscription(silent=false){

  if(sub){const result=await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint);if(result.error)throw result.error;await sub.unsubscribe()}
  pushEnabled=false;pushStatusUser=me?.id||null;return true

}
async function enablePush(){

 const permission=await Notification.requestPermission();if(permission!=='granted'){alert('No se habilitaron los avisos. Podés cambiar el permiso desde la configuración del navegador.');return}

 const sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:vapidBytes(PUSH_VAPID_PUBLIC_KEY)});

  let k=1;g.forEach((gr,gi)=>{for(let i=0;i<gr.length;i++)for(let j=i+1;j<gr.length;j++)rows.push(mk({grupo:String.fromCharCode(65+gi),numero:k++,pareja_a_id:gr[i].id,pareja_b_id:gr[j].id}))})}
