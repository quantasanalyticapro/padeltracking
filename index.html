<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><title>Pádel Tracking</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px system-ui,sans-serif;background:#0f172a;color:#e2e8f0;padding-bottom:70px}
main{max-width:560px;margin:auto;padding:12px}
h2,h3{margin:.4em 0}.mut{color:#94a3b8;font-size:.85em}
input,select{width:100%;padding:12px;margin:4px 0;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#fff;font-size:16px}
button{padding:12px 14px;border:0;border-radius:10px;background:#334155;color:#fff;font-size:15px;font-weight:600}
button.p{background:#16a34a}button.d{background:#b91c1c}button.w{width:100%;margin:4px 0}
.c{background:#1e293b;border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#020617;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border-radius:0;background:none;padding:16px 4px}nav .on{color:#4ade80}
.tag{font-size:.75em;padding:2px 8px;border-radius:99px;background:#334155}
.big{font-size:56px;font-weight:800;text-align:center;line-height:1}
.sc{text-align:center}.sets{display:flex;gap:6px;justify-content:center;margin:6px 0}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{border-radius:14px;padding:8px}.TA{background:#14532d}.TB{background:#1e3a8a}
.team button{width:100%;height:84px;margin:5px 0;font-size:18px;background:#0008}
.team h3{font-size:15px;text-align:center;min-height:2.4em}
.bar{position:fixed;bottom:0;left:0;right:0;background:#020617;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.bar button{flex:1;height:52px}
.sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end}
.sheet>div{width:100%;background:#1e293b;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0}
.sheet button{width:100%;height:76px;margin:6px 0;font-size:20px}
.ban{background:#854d0e;border-radius:12px;padding:12px;margin:10px 0;text-align:center}
</style></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const URL_='https://ypptwklnylrnnoqxcupe.supabase.co', KEY='';  // KEY: clave publicable (sb_publishable_...)
let K=KEY||localStorage.getItem('sbk')||'';
if(!K){K=(prompt('Pegá la clave publicable de Supabase (Settings > API Keys)')||'').trim();localStorage.setItem('sbk',K)}
const sb=supabase.createClient(URL_,K),$=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me=null,J={},T={},P={},M={},tab='partidos',sel=null,score=null,pick=null,msg='';

/* ---------- Motor de puntuación (pádel: punto de oro, 2 de 3 sets, tie-break a 7) ---------- */
function calc(evs){const s={sets:[],g:[0,0],p:[0,0],tb:false,w:null};
 const game=a=>{const b=1-a;s.g[a]++;s.p=[0,0];
  if((s.g[a]>=6&&s.g[a]-s.g[b]>=2)||s.g[a]==7){s.sets.push([...s.g]);s.g=[0,0];s.tb=false;
   if(s.sets.filter(x=>x[a]>x[b]).length==2)s.w=a}
  else if(s.g[0]==6&&s.g[1]==6)s.tb=true};
 for(const e of evs){if(s.w!=null)break;const a=e.equipo_que_suma=='A'?0:1,b=1-a;s.p[a]++;
  if(s.tb?(s.p[a]>=7&&s.p[a]-s.p[b]>=2):s.p[a]==4)game(a)}
 return s}
const pts=s=>s.tb?s.p.join(' - '):s.p.map(x=>[0,15,30,40][x]).join(' - ');
const txt=s=>s.sets.map(x=>x.join('-')).join(' ')+(s.sets.length?' | ':'')+s.g.join('-')+' ('+pts(s)+')';
const sets_=s=>s.sets.map(x=>x.join('-')).join(', ');

/* ---------- Datos ---------- */
const pl=id=>P[id]?[P[id].jugador_1_id,P[id].jugador_2_id].filter(Boolean):[];
const pn=id=>P[id]?pl(id).map(x=>J[x]?.nombre||'?').join(' / ')||'?':'Por definir';
const isPl=m=>[m.pareja_a_id,m.pareja_b_id].some(i=>pl(i).includes(me.id));
const isOrg=m=>T[m.torneo_id]?.organizador_id==me.id;
const canScore=m=>isOrg(m)||isPl(m)||m.anotador_id==me.id;
async function load(){
 const r=await Promise.all(['jugadores','torneos','parejas_inscritas','partidos_fixture'].map(n=>sb.from(n).select('*').order('creado_at')));
 const mp=d=>Object.fromEntries((d||[]).map(x=>[x.id,x]));
 J=mp(r[0].data);T=mp(r[1].data);P=mp(r[2].data);M=mp(r[3].data);
 const {data:{user}}=await sb.auth.getUser();me=user?J[user.id]:null}

/* ---------- Vistas ---------- */
function vLogin(){return `<h2>🎾 Pádel Tracking</h2><div class=c>
<input id=em type=email placeholder="Email"><input id=pw type=password placeholder="Contraseña (6+ caracteres)">
<input id=nm placeholder="Tu nombre (solo para crear cuenta)">
<button class="p w" data-a=login>Entrar</button><button class=w data-a=signup>Crear cuenta</button>
<p class=mut>${esc(msg)}</p></div>`}

function mCard(m){const t=T[m.torneo_id],c=canScore(m),d=isOrg(m)||isPl(m);
 return `<div class=c><div class="row sp"><span class=mut>${esc(t?.nombre)} · ${m.fase}${m.grupo?' '+m.grupo:''}</span><span class=tag>${m.estado.replace('_',' ')}</span></div>
 <div style="margin:8px 0"><b>${esc(pn(m.pareja_a_id))}</b><br><span class=mut>vs</span><br><b>${esc(pn(m.pareja_b_id))}</b></div>
 ${m.resultado_sets?`<div>Resultado: <b>${esc(m.resultado_sets)}</b></div>`:''}
 ${m.anotador_id?`<div class=mut>Anotador: ${esc(J[m.anotador_id]?.nombre)}</div>`:''}
 <div class=row>${c&&m.estado!='finalizado'&&m.pareja_a_id&&m.pareja_b_id?`<button class=p data-a=score data-id=${m.id}>📝 Anotar</button>`:''}
 ${d&&m.estado!='finalizado'?`<button data-a=des data-id=${m.id}>👤 Designar anotador</button>`:''}</div></div>`}

function vPartidos(){const l=Object.values(M).filter(canScore).sort((a,b)=>(a.estado=='finalizado')-(b.estado=='finalizado'));
 return `<h2>Mis partidos</h2>${l.map(mCard).join('')||'<p class=mut>Todavía no tenés partidos. Creá o unite a un torneo.</p>'}`}

function vTorneos(){
 if(sel){const t=T[sel],ps=Object.values(P).filter(p=>p.torneo_id==sel),ms=Object.values(M).filter(m=>m.torneo_id==sel),org=t.organizador_id==me.id;
  const ya=ps.some(p=>pl(p.id).includes(me.id));
  return `<button data-a=back>‹ Torneos</button><h2>${esc(t.nombre)}</h2><div class=mut>${esc(t.categoria)} · ${t.formato.replace('_',' ')} · ${t.estado.replace('_',' ')}</div>
  <div class=c><h3>Parejas (${ps.length})</h3>${ps.map(p=>`<div>• ${esc(pn(p.id))} <span class=mut>Elo ${p.elo_promedio_pareja}</span></div>`).join('')||'<span class=mut>Sin inscriptos</span>'}
  ${t.estado=='inscripciones_abiertas'&&!ya?`<select id=cp><option value="">Me anoto sin compañero</option>${Object.values(J).filter(j=>j.id!=me.id).map(j=>`<option value=${j.id}>con ${esc(j.nombre)}</option>`).join('')}</select><button class="p w" data-a=join>Inscribirme</button>`:''}
  ${org&&t.estado=='inscripciones_abiertas'?`<button class="p w" data-a=gen>⚡ Cerrar inscripciones y generar fixture</button>`:''}</div>
  ${ms.map(mCard).join('')}`}
 return `<h2>Torneos</h2>${Object.values(T).reverse().map(t=>`<div class=c data-a=open data-id=${t.id}><b>${esc(t.nombre)}</b> <span class=tag>${t.estado.replace('_',' ')}</span><div class=mut>${esc(t.categoria)} · ${t.formato.replace('_',' ')}</div></div>`).join('')}
 <div class=c><h3>Nuevo torneo</h3><input id=tn placeholder="Nombre"><input id=tc placeholder="Categoría (ej. 5ta)">
 <select id=tf><option value=grupos>Fase de grupos</option><option value=eliminacion_directa>Eliminación directa</option></select>
 <button class="p w" data-a=newT>Crear torneo</button></div>`}

function vRank(){return `<h2>Ranking Elo</h2><div class=c>${Object.values(J).sort((a,b)=>b.elo_actual-a.elo_actual).map((j,i)=>
 `<div class="row sp" style="padding:6px 0"><span>${i+1}. ${esc(j.nombre)}</span><span><b>${j.elo_actual}</b> <span class=mut>${j.partidos_ganados}/${j.partidos_jugados}</span></span></div>`).join('')}</div>`}

function vScore(){const m=M[score.id],s=calc(score.evs),on=m.estado=='en_progreso',fin=s.w!=null;
 const team=eq=>`<div class="team T${eq}"><h3>${esc(pn(eq=='A'?m.pareja_a_id:m.pareja_b_id))}</h3>
  <button data-a=pick data-t=winner data-e=${eq} ${on&&!fin?'':'disabled'}>🏆 Winner</button>
  <button data-a=pick data-t=error_no_forzado data-e=${eq} ${on&&!fin?'':'disabled'}>❌ Error rival</button>
  <button data-a=add data-t=punto_general data-e=${eq} ${on&&!fin?'':'disabled'}>＋ Punto</button></div>`;
 let sheet='';
 if(pick){const side=pick.t=='winner'?pick.e:(pick.e=='A'?'B':'A'),ids=pl(side=='A'?m.pareja_a_id:m.pareja_b_id);
  sheet=`<div class=sheet data-a=cancel><div><h3>${pick.t=='winner'?'¿Quién hizo el winner?':'¿Quién cometió el error?'}</h3>
  ${ids.map(j=>`<button data-a=add data-t=${pick.t} data-e=${pick.e} data-j=${j}>${esc(J[j]?.nombre)}</button>`).join('')}</div></div>`}
 return `<div class=row sp><button data-a=back>‹ Salir</button><span class=mut>${esc(T[m.torneo_id]?.nombre)} · ${m.fase}</span></div>
 <div class=sc><div class=sets>${s.sets.map(x=>`<span class=tag>${x.join('-')}</span>`).join('')}</div>
 <div class=big>${s.g[0]} - ${s.g[1]}</div><h2>${pts(s)}</h2>${s.tb?'<div class=mut>Tie-break</div>':''}</div>
 ${m.estado=='pendiente'?`<div class=ban>El partido no empezó<br><button class="p w" data-a=start>▶ Comenzar partido</button></div>`:''}
 ${fin?`<div class=ban>🏁 Ganó ${esc(pn(s.w==0?m.pareja_a_id:m.pareja_b_id))} (${sets_(s)})<br><button class="p w" data-a=close>Cerrar partido y calcular Elo</button></div>`:''}
 <div class=teams>${team('A')}${team('B')}</div><div style="height:70px"></div>
 <div class=bar><button class=d data-a=undo ${score.evs.length?'':'disabled'}>↩ Deshacer</button></div>${sheet}`}

function render(){
 if(!me){A.innerHTML=vLogin();return}
 if(score){A.innerHTML=vScore();return}
 A.innerHTML=`<div class="row sp"><span class=mut>👤 ${esc(me.nombre)} · Elo ${me.elo_actual}</span><button data-a=out>Salir</button></div>`+
 (tab=='partidos'?vPartidos():tab=='torneos'?vTorneos():vRank())+
 `<nav>${[['partidos','🎾 Partidos'],['torneos','🏆 Torneos'],['rank','📊 Ranking']].map(([k,l])=>`<button class="${tab==k?'on':''}" data-a=tab data-v=${k}>${l}</button>`).join('')}</nav>`}

/* ---------- Acciones ---------- */
const err=r=>{if(r.error){alert(r.error.message);return true}};
async function openScore(id){const r=await sb.from('estadisticas_eventos').select('*').eq('partido_id',id).order('id');
 score={id,evs:r.data||[]}}
function fixture(t){
 const ps=Object.values(P).filter(p=>p.torneo_id==t.id).sort(()=>Math.random()-.5),mk=o=>({id:crypto.randomUUID(),torneo_id:t.id,fase:'grupos',grupo:null,numero:null,pareja_a_id:null,pareja_b_id:null,siguiente_partido_id:null,siguiente_slot:null,...o});
 if(ps.length<2||ps.some(p=>!p.jugador_2_id)){alert('Hacen falta al menos 2 parejas y todas completas (con compañero).');return null}
 const rows=[];
 if(t.formato=='grupos'){const n=t.parejas_por_grupo,g=[];for(let i=0;i<ps.length;i+=n)g.push(ps.slice(i,i+n));
  if(g.length>1&&g[g.length-1].length<2)g[g.length-2].push(...g.pop());
  let k=1;g.forEach((gr,gi)=>{for(let i=0;i<gr.length;i++)for(let j=i+1;j<gr.length;j++)rows.push(mk({grupo:String.fromCharCode(65+gi),numero:k++,pareja_a_id:gr[i].id,pareja_b_id:gr[j].id}))})}
 else{const n=ps.length,nm={2:'final',4:'semifinal',8:'cuartos',16:'octavos'};
  if(!nm[n]){alert('Eliminación directa necesita 2, 4, 8 o 16 parejas (hay '+n+').');return null}
  const R=[];for(let m=n/2;m>=1;m/=2)R.push(Array.from({length:m},(_,i)=>mk({fase:nm[m*2],numero:i+1})));
  R[0].forEach((r,i)=>{r.pareja_a_id=ps[2*i].id;r.pareja_b_id=ps[2*i+1].id});
  R.forEach((rd,ri)=>{if(ri<R.length-1)rd.forEach((r,i)=>{r.siguiente_partido_id=R[ri+1][i>>1].id;r.siguiente_slot=i%2?'B':'A'})});
  rows.push(...R.flat())}
 return rows}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 if(e.target.closest('.sheet>div')&&b.dataset.a=='cancel')return;
 const d=b.dataset,a=d.a;
 try{
 if(a=='login'){const r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(err(r))return;await load()}
 else if(a=='signup'){const r=await sb.auth.signUp({email:$('#em').value.trim(),password:$('#pw').value,options:{data:{nombre:$('#nm').value.trim()}}});
  if(r.error){msg=r.error.message}else if(!r.data.session){msg='Cuenta creada. Revisá tu email para confirmarla y luego entrá.'}else await load()}
 else if(a=='out'){await sb.auth.signOut();me=null}
 else if(a=='tab'){tab=d.v;sel=null}
 else if(a=='open'){sel=d.id}
 else if(a=='back'){if(score){score=null;await load()}else sel=null}
 else if(a=='newT'){const r=await sb.from('torneos').insert({nombre:$('#tn').value.trim(),categoria:$('#tc').value.trim()||'General',formato:$('#tf').value,organizador_id:me.id});if(err(r))return;await load()}
 else if(a=='join'){const c=$('#cp').value||null,r=await sb.from('parejas_inscritas').insert({torneo_id:sel,jugador_1_id:me.id,jugador_2_id:c});if(err(r))return;await load()}
 else if(a=='gen'){const rows=fixture(T[sel]);if(!rows)return;
  const r=await sb.from('partidos_fixture').insert(rows);if(err(r))return;
  await sb.from('torneos').update({estado:'en_progreso'}).eq('id',sel);await load()}
 else if(a=='des'){const v=prompt('Email del jugador registrado que va a anotar (vacío = yo):');if(v===null)return;
  let id=me.id;if(v.trim()){const r=await sb.from('jugadores').select('id').ilike('email',v.trim()).maybeSingle();if(!r.data){alert('No hay ningún jugador registrado con ese email.');return}id=r.data.id}
  const r=await sb.from('partidos_fixture').update({anotador_id:id}).eq('id',d.id);if(err(r))return;await load()}
 else if(a=='score'){await openScore(d.id)}
 else if(a=='start'){const r=await sb.from('partidos_fixture').update({estado:'en_progreso'}).eq('id',score.id);if(err(r))return;await load();await openScore(score.id)}
 else if(a=='pick'){pick={t:d.t,e:d.e}}
 else if(a=='cancel'){pick=null}
 else if(a=='add'){pick=null;const s=calc(score.evs);if(s.w!=null)return;
  const n=calc(score.evs.concat([{equipo_que_suma:d.e}])),
  r=await sb.from('estadisticas_eventos').insert({partido_id:score.id,tipo_evento:d.t,jugador_id:d.j||null,equipo_que_suma:d.e,marcador_momento:txt(n)});if(err(r))return;await openScore(score.id)}
 else if(a=='undo'){const l=score.evs[score.evs.length-1];const r=await sb.from('estadisticas_eventos').delete().eq('id',l.id);if(err(r))return;await openScore(score.id)}
 else if(a=='close'){const m=M[score.id],s=calc(score.evs);
  const r=await sb.from('partidos_fixture').update({estado:'finalizado',resultado_sets:sets_(s),pareja_ganadora_id:s.w==0?m.pareja_a_id:m.pareja_b_id}).eq('id',m.id);
  if(err(r))return;score=null;await load()}
 }catch(x){alert(x.message)}
 render()});

sb.auth.onAuthStateChange((ev)=>{if(ev=='SIGNED_OUT'){me=null;render()}});
load().then(render);
</script></body></html>
