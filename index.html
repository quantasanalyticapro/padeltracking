<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#edf3f4"><title>Santa Padel Club</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f3d73'/%3E%3Cpath d='M10 44 L6 20 L22 32 L32 14 L42 32 L58 20 L54 44 Z' fill='%23c9a24b'/%3E%3Crect x='10' y='46' width='44' height='6' rx='2' fill='%2335b6dc'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px system-ui,-apple-system,sans-serif;background:#edf3f4;color:#19313a;padding-bottom:78px;min-height:100vh}
main{max-width:720px;margin:auto;padding:18px 16px}
h2,h3{margin:.45em 0;color:#19313a}h2{font-size:1.55rem;letter-spacing:-.025em}h3{font-size:1.1rem}.mut{color:#657b81;font-size:.85em}
input,select{width:100%;padding:12px;margin:4px 0;border-radius:11px;border:1px solid #ccdadd;background:#fff;color:#19313a;font-size:16px;box-shadow:0 1px 2px #14323a0b}
input:focus,select:focus{outline:2px solid #75aab0;outline-offset:1px}
button{padding:12px 14px;border:0;border-radius:11px;background:#dcebee;color:#1c5965;font-size:15px;font-weight:650;transition:filter .15s,transform .15s}
button:hover{filter:brightness(.96)}button:active{transform:translateY(1px)}
button.p{background:#1c5965;color:#fff}button.d{background:#bd5e50;color:#fff}button.w{width:100%;margin:4px 0}
.c{background:#fff;border:1px solid #dce7e8;border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #1838400a}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
nav{position:fixed;z-index:5;bottom:0;left:0;right:0;display:flex;background:#183a43;padding:4px 10px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px #142d3420}
nav button{flex:1;border-radius:12px;background:none;color:#d9e5e6;padding:14px 4px}nav .on{color:#ff9a80;background:#ffffff14}
.tag{font-size:.75em;padding:4px 9px;border-radius:99px;background:#e2edef;color:#1c5965;font-weight:650}
.big{font-size:56px;font-weight:800;text-align:center;line-height:1;color:#1c5965;font-variant-numeric:tabular-nums}
.sc{text-align:center;padding:12px 0}.sets{display:flex;gap:6px;justify-content:center;margin:8px 0}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.team{border-radius:16px;padding:10px;background:#e5eff0;color:#19313a}.TA{background:#dfecee}.TB{background:#e9e8f1}
.team button{width:100%;min-height:66px;margin:5px 0;font-size:16px;background:#fff;color:#1c5965;border:1px solid #d6e2e4}
.team h3{font-size:15px;text-align:center;min-height:2.4em}
.bar{position:fixed;z-index:6;bottom:0;left:0;right:0;background:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;border-top:1px solid #dce7e8}
.bar button{flex:1;height:52px}
.sheet{position:fixed;z-index:10;inset:0;background:#132a30a8;display:flex;align-items:flex-end;backdrop-filter:blur(3px)}
.sheet>div{width:100%;background:#fff;color:#19313a;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;box-shadow:0 -8px 30px #102a3025}
.sheet button{width:100%;min-height:60px;margin:6px 0;font-size:18px}
.pw-wrap{position:relative}.pw-wrap input{padding-right:54px}.pw-toggle{position:absolute;right:7px;top:9px;width:40px;height:38px;padding:0;background:transparent;color:#1c5965;border-radius:8px;display:grid;place-items:center}.pw-toggle svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.pw-toggle .eye-slash{display:none}.pw-toggle.is-visible .eye-slash{display:block}
.ban{background:#fff0e9;border:1px solid #f2d1c4;color:#794c43;border-radius:14px;padding:14px;margin:12px 0;text-align:center}
/* marca */
.brand{text-align:center;margin:14px 0 6px}.brand .el{font:800 20px system-ui;color:#0f3d73;margin-top:2px}
.brand .santa{font:900 46px/1.05 system-ui;letter-spacing:1px;color:#0f3d73;-webkit-text-stroke:3px #c9a24b;paint-order:stroke fill}
.brand .sub{font:800 19px system-ui;letter-spacing:.2em;text-transform:uppercase;color:#0f3d73;margin-top:4px}.brand .sub2{color:#657b81;font-size:.85em;margin-top:6px}
/* fotos */
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#dcebee;color:#1c5965;display:inline-grid;place-items:center;font-weight:700;font-size:14px;flex:none;vertical-align:middle}.av.s{width:28px;height:28px;font-size:11px}
@media(max-width:420px){main{padding:14px 12px}.teams{gap:8px}.team{padding:7px}.team button{font-size:14px;padding:10px 6px}.big{font-size:48px}nav button{font-size:13px}}
</style></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const URL_='https://ypptwklnylrnnoqxcupe.supabase.co', KEY='sb_publishable_vJWdwmoVfWYCgD2lMA2hpQ_EgNjSBvG';  // KEY: clave publicable (sb_publishable_...)
let K=KEY||localStorage.getItem('sbk')||'';
if(!K){K=(prompt('Pegá la clave publicable de Supabase (Settings > API Keys)')||'').trim();localStorage.setItem('sbk',K)}
const sb=supabase.createClient(URL_,K),$=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me=null,J={},T={},P={},M={},Q={},tab='partidos',sel=null,score=null,pick=null,msg='',ed=null;

/* ---------- Motor de puntuación configurable ----------
   cfg: sets (1|3) · juegos (4|6) · tb (0|7|10 al empatar juegos) · stb (0|7|10 3.er set) · oro (punto de oro) */
const DEF={sets:3,juegos:6,tb:7,stb:0,oro:true};
const gm=c=>c.oro===true?'oro':c.oro===false?'ventaja':(c.oro||'oro');  // oro | ventaja | estrella
function calc(evs,c=DEF){const need=c.sets==1?1:2,J=c.juegos,s={sets:[],g:[0,0],p:[0,0],tb:false,stb:false,w:null,dz:0,gold:false,dec:false};
 const endSet=a=>{const r=[...(s.stb?s.p:s.g)];s.sets.push(r);s.g=[0,0];s.p=[0,0];s.tb=false;s.stb=false;
  if(s.sets.filter(x=>x[a]>x[1-a]).length==need)s.w=a;else if(c.sets==3&&c.stb>0&&s.sets.length==2)s.stb=true};
 const K=J==4?3:J;  // set a 4: el desempate se juega al llegar a 3-3 (y el set termina 4-3)
 const game=a=>{const b=1-a;s.g[a]++;s.p=[0,0];s.dz=0;s.gold=false;s.dec=false;
  const win=K<J?s.g[a]>=J:((s.g[a]>=J&&s.g[a]-s.g[b]>=2)||((c.tb>0||c.jd)&&s.g[a]==J+1));
  if(win)endSet(a);
  else if(s.g[0]==K&&s.g[1]==K){if(c.jd)s.dec=true;else if(c.tb>0)s.tb=true}};
 for(const e of evs){if(s.w!=null)break;const a=e.equipo_que_suma=='A'?0:1,b=1-a;s.p[a]++;
  if(s.stb){if(s.p[a]>=c.stb&&s.p[a]-s.p[b]>=2)endSet(a)}
  else if(s.tb){if(s.p[a]>=c.tb&&s.p[a]-s.p[b]>=2)game(a)}
  else{const md=s.dec?'oro':gm(c);
   if(md=='oro'){if(s.p[a]==4)game(a)}
   else if(s.gold)game(a)
   else if(s.p[a]>=4&&s.p[a]-s.p[b]>=2)game(a)
   else if(md=='estrella'&&s.p[0]==s.p[1]&&s.p[0]>=3){s.dz++;if(s.dz==3)s.gold=true}}}
 return s}
const pts=(s,c=DEF)=>s.tb||s.stb?s.p.join(' - '):(gm(c)!='oro'&&s.p[0]>=3&&s.p[1]>=3)?(s.p[0]==s.p[1]?'40 - 40':s.p[0]>s.p[1]?'Ad - 40':'40 - Ad'):s.p.map(x=>[0,15,30,40][x]).join(' - ');
const txt=(s,c)=>s.sets.map(x=>x.join('-')).join(' ')+(s.sets.length?' | ':'')+s.g.join('-')+' ('+pts(s,c)+')';
const sets_=s=>s.sets.map(x=>x.join('-')).join(', ');
const fmtTxt=c=>(c.sets==1?'1 set':'Mejor de 3')+' · '+c.juegos+' juegos'+(c.jd?' · empate: un juego más con punto de oro':c.tb?' · TB a '+c.tb:' · sin TB')+(c.sets==3&&c.stb?' · 3.º: súper TB a '+c.stb:'')+({oro:' · punto de oro',ventaja:' · ventaja',estrella:' · punto estrella'})[gm(c)];
const fdate=f=>f?new Date(f+'T12:00').toLocaleDateString('es-AR'):'';
const selF=(id,l,o,v)=>`<label class=mut>${l}</label><select id=${id}>${o.map(([k,t])=>`<option value="${k}" ${String(v)==String(k)?'selected':''}>${t}</option>`).join('')}</select>`;
const fmtFields=c=>selF('fs','Sets',[[1,'1 set'],[3,'Mejor de 3 sets']],c.sets)+selF('fj','Juegos por set',[[6,'6 juegos'],[4,'4 juegos']],c.juegos)
 +selF('ft','Si empatan en juegos (6-6; en sets a 4, 3-3)',[[7,'Tie-break a 7'],[10,'Súper tie-break a 10'],['jd','Un juego más (se define con punto de oro)'],[0,'Sin tie-break (se sigue jugando)']],c.jd?'jd':c.tb)
 +selF('fd','3.er set (si es mejor de 3)',[[0,'Set normal'],[10,'Súper tie-break a 10'],[7,'Súper tie-break a 7']],c.stb)
 +selF('fo','Cuando llegan a 40-40',[['oro','Punto de oro (un solo punto decide)'],['estrella','Punto estrella (hasta 2 ventajas y luego punto de oro)'],['ventaja','Ventaja clásica (se gana por 2 puntos)']],gm(c));
const readFmt=()=>({sets:+$('#fs').value,juegos:+$('#fj').value,tb:$('#ft').value=='jd'?0:+$('#ft').value,jd:$('#ft').value=='jd',stb:+$('#fd').value,oro:$('#fo').value});

/* ---------- Datos ---------- */
const pl=id=>P[id]?[P[id].jugador_1_id,P[id].jugador_2_id].filter(Boolean):[];
const nm=id=>{const j=J[id];if(!j)return '?';const d=Object.values(J).some(o=>o.id!=id&&o.nombre.trim().toLowerCase()==j.nombre.trim().toLowerCase());return d?`${j.nombre} (${(j.email||'').split('@')[0]})`:j.nombre};
const ini=j=>(j.nombre||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const av=(id,c='')=>{const j=J[id];if(!j)return '';return j.foto_url?`<img class="av ${c}" src="${esc(j.foto_url)}" alt="" loading=lazy>`:`<span class="av ${c}">${esc(ini(j))}</span>`};
const byEmail=e=>Object.values(J).find(j=>(j.email||'').toLowerCase()==e.trim().toLowerCase());
const ap=id=>{const j=J[id];if(!j)return '?';const w=j.nombre.trim().split(/\s+/),a=w[w.length-1];
 const d=Object.values(J).some(o=>o.id!=id&&o.nombre.trim().split(/\s+/).pop().toLowerCase()==a.toLowerCase());
 return d?(w.length>1?w[0][0].toUpperCase()+'. '+a:nm(id)):a};
const pnf=id=>P[id]?pl(id).map(x=>nm(x)).join(' / ')||'?':'Por definir';
const pn=id=>P[id]?pl(id).map(ap).join(' / ')||'?':'Por definir';
const cfgOf=m=>({...DEF,...(T[m.torneo_id]?.config||{}),...(m.config||{})});
const isPl=m=>[m.pareja_a_id,m.pareja_b_id].some(i=>pl(i).includes(me.id));
const isOrg=m=>T[m.torneo_id]?.organizador_id==me.id;
const canScore=m=>isOrg(m)||isPl(m)||m.anotador_id==me.id;
async function load(){
 const r=await Promise.all(['jugadores','torneos','parejas_inscritas','partidos_fixture','propuestas_pareja'].map(n=>sb.from(n).select('*').order('creado_at')));
 const mp=d=>Object.fromEntries((d||[]).map(x=>[x.id,x]));
 J=mp(r[0].data);T=mp(r[1].data);P=mp(r[2].data);M=mp(r[3].data);Q=mp(r[4].data);
 const {data:{user}}=await sb.auth.getUser();me=user?J[user.id]:null}

/* ---------- Vistas ---------- */
const inv=()=>Object.values(P).filter(p=>p.jugador_2_id==me.id&&!p.confirmada).map(p=>`<div class=ban>${esc(nm(p.jugador_1_id))} te invitó a jugar "${esc(T[p.torneo_id]?.nombre)}" como pareja<div class=row style="justify-content:center;margin-top:8px"><button class=p data-a=acc data-id=${p.id}>Aceptar</button><button class=d data-a=rej data-id=${p.id}>Rechazar</button></div></div>`).join('');
const invPareja=()=>Object.values(Q).filter(q=>q.estado=='pendiente'&&q.jugador_invitado_id==me.id).map(q=>`<div class=ban>El organizador te propone como pareja de ${esc(nm(q.jugador_origen_id))} para "${esc(T[q.torneo_id]?.nombre)}".<div class=row style="justify-content:center;margin-top:8px"><button class=p data-a=propAccept data-id=${q.id}>Aceptar propuesta</button><button class=d data-a=propReject data-id=${q.id}>Rechazar</button></div></div>`).join('');
function vParejasAdmin(t,ps){
 const pending=Object.values(Q).filter(q=>q.torneo_id==t.id&&q.estado=='pendiente');
 const ocupados=new Set(pending.flatMap(q=>[q.jugador_origen_id,q.jugador_invitado_id]));
 const solos=ps.filter(p=>!p.jugador_2_id);
 const disponibles=solos.filter(p=>!ocupados.has(p.jugador_1_id));
 const opts=disponibles.map(p=>`<option value="${p.id}">${esc(nm(p.jugador_1_id))}</option>`).join('');
 const listado=solos.map(p=>`<div class=row style="justify-content:space-between;padding:4px 0">${esc(nm(p.jugador_1_id))}<span class=mut>${ocupados.has(p.jugador_1_id)?'Propuesta pendiente':'Sin pareja'}</span></div>`).join('')||'<span class=mut>No hay inscriptos sin pareja.</span>';
 const propuestas=pending.map(q=>`<div class=row style="justify-content:space-between;padding:5px 0">${esc(nm(q.jugador_origen_id))} + ${esc(nm(q.jugador_invitado_id))}<span class=mut>Pendiente de aceptación</span><button class=d data-a=propCancel data-id=${q.id}>Cancelar</button></div>`).join('');
 return `<div class=c><h3>Inscriptos sin pareja (${solos.length})</h3>${listado}${disponibles.length>=2?`<p class=mut>Elegí dos. La otra persona recibirá la propuesta dentro de la app.</p><div class=row><select id=pairA style="flex:1"><option value="">Primera persona</option>${opts}</select><select id=pairB style="flex:1"><option value="">Compañero propuesto</option>${opts}</select></div><button class="p w" data-a=propMake>Proponer pareja</button>`:solos.length<2?'<p class=mut>Se necesitan al menos dos inscriptos sin pareja para proponer un dúo.</p>':'<p class=mut>Los inscriptos disponibles ya tienen una propuesta pendiente.</p>'}${propuestas?`<hr><h3>Propuestas pendientes</h3>${propuestas}`:''}</div>`}
function vEd(){const T_=ed.k=='T',o=T_?T[ed.id]:M[ed.id],c=cfgOf(T_?{torneo_id:ed.id}:o);
 return `<div class=sheet><div style="max-height:92vh;overflow:auto"><h3>${T_?'Fecha y formato del torneo':'Formato de este partido'}</h3>${T_?`<label class=mut>Fecha de inicio</label><input id=fdt type=date value="${o.fecha_inicio||''}">`:''}${fmtFields(c)}
 <button class="p w" data-a=saveEd>Guardar</button>${!T_&&o.config?'<button class=w data-a=resetEd>Usar el formato del torneo</button>':''}<button class=w data-a=closeEd>Cancelar</button></div></div>`}
function vLogin(){return `<div class=brand><svg viewBox="0 0 64 40" width=72 aria-hidden=true><path d="M6 33 L3 11 L19 22 L32 5 L45 22 L61 11 L58 33 Z" fill="#c9a24b" stroke="#0f3d73" stroke-width="3" stroke-linejoin="round"/><rect x="6" y="34" width="52" height="5" rx="2" fill="#0f3d73"/><g fill="#fff" stroke="#0f3d73" stroke-width="2"><circle cx="3" cy="10" r="3"/><circle cx="32" cy="4" r="3"/><circle cx="61" cy="10" r="3"/></g></svg><div class=santa>SANTA</div><div class=sub>Padel Club</div><div class=sub2>Torneos y ranking</div></div><div class=c>
<input id=em type=email placeholder="Email"><div class=pw-wrap><input id=pw type=password placeholder="Contraseña (6+ caracteres)"><button type=button class=pw-toggle id=togglePw aria-label="Mostrar contraseña" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><path class=eye-slash d="m4 4 16 16"/></svg></button></div>
<input id=nm placeholder="Nombre y Apellido (solo para crear la cuenta)">
<button class="p w" data-a=login>Entrar</button><button class=w data-a=signup>Crear cuenta</button>
<p class=mut>${esc(msg)}</p></div>`}

function mCard(m){const t=T[m.torneo_id],c=canScore(m),d=isOrg(m)||isPl(m);
 return `<div class=c><div class="row sp"><span class=mut>${esc(t?.nombre)} · ${m.fase}${m.grupo?' '+m.grupo:''}</span><span class=tag>${m.estado.replace('_',' ')}</span></div>
 <div class=row style="margin:8px 0 2px;flex-wrap:nowrap">${pl(m.pareja_a_id).map(x=>av(x,'s')).join('')}<b>${esc(pn(m.pareja_a_id))}</b></div><div class=mut>vs</div><div class=row style="margin:2px 0 8px;flex-wrap:nowrap">${pl(m.pareja_b_id).map(x=>av(x,'s')).join('')}<b>${esc(pn(m.pareja_b_id))}</b></div>
 ${m.resultado_sets?`<div>Resultado: <b>${esc(m.resultado_sets)}</b></div>`:''}
 <div class=mut>${fmtTxt(cfgOf(m))}</div>
 ${m.anotador_id?`<div class=mut>Anotador: ${esc(nm(m.anotador_id))}</div>`:''}
 <div class=row>${c&&m.estado!='finalizado'&&m.pareja_a_id&&m.pareja_b_id?`<button class=p data-a=score data-id=${m.id}>📝 Anotar</button>`:''}
 ${d&&m.estado!='finalizado'?`<button data-a=des data-id=${m.id}>👤 Designar anotador</button>`:''}
 ${isOrg(m)&&m.estado=='pendiente'?`<button data-a=edM data-id=${m.id}>⚙ Formato</button>`:''}</div></div>`}

function vPartidos(){const l=Object.values(M).filter(canScore).sort((a,b)=>(a.estado=='finalizado')-(b.estado=='finalizado'));
 return `<h2>Mis partidos</h2>${l.map(mCard).join('')||'<p class=mut>Todavía no tenés partidos. Creá o unite a un torneo.</p>'}`}

function vTorneos(){
 if(sel){const t=T[sel],ps=Object.values(P).filter(p=>p.torneo_id==sel),ms=Object.values(M).filter(m=>m.torneo_id==sel),org=t.organizador_id==me.id;
  const ya=ps.some(p=>pl(p.id).includes(me.id)),puedeFixture=ps.length>=2&&ps.every(p=>p.jugador_2_id&&p.confirmada);
  return `<button data-a=back>‹ Torneos</button><h2>${esc(t.nombre)}</h2><div class=mut>${esc(t.categoria)} · ${t.formato.replace('_',' ')} · ${t.estado.replace('_',' ')}</div><div class=mut>${t.fecha_inicio?'📅 '+fdate(t.fecha_inicio)+' · ':''}${fmtTxt(cfgOf({torneo_id:t.id}))}</div>${org?'<button data-a=edT>⚙ Fecha y formato</button>':''}
  <div class=c><h3>Parejas (${ps.length})</h3>${ps.map(p=>`<div>• ${esc(pnf(p.id))}${!p.jugador_2_id?' <span class=mut>(sin pareja)</span>':p.confirmada?'':' ⏳ <span class=mut>(compañero sin confirmar)</span>'} <span class=mut>Puntaje promedio ${p.elo_promedio_pareja}</span></div>`).join('')||'<span class=mut>Sin inscriptos</span>'}
  ${t.estado=='inscripciones_abiertas'&&!ya?`<input id=cp type=email placeholder="Email del compañero (opcional; podés inscribirte solo)"><p class=mut>El torneo necesita parejas completas y confirmadas para generar los partidos.</p><button class="p w" data-a=join>Inscribirme</button>`:''}
  ${org&&t.estado=='inscripciones_abiertas'?`<p class=mut>${puedeFixture?'Cuando generes el fixture se cerrarán las inscripciones.':'Completá y confirmá todas las parejas antes de generar el fixture.'}</p><button class="p w" data-a=gen ${puedeFixture?'':'disabled'}>⚡ Cerrar inscripciones y generar fixture</button>`:''}</div>
  ${org&&t.estado=='inscripciones_abiertas'?vParejasAdmin(t,ps):''}
  ${ms.map(mCard).join('')}`}
 return `<h2>Torneos</h2>${Object.values(T).reverse().map(t=>`<div class=c data-a=open data-id=${t.id}><b>${esc(t.nombre)}</b> <span class=tag>${t.estado.replace('_',' ')}</span><div class=mut>${esc(t.categoria)} · ${t.formato.replace('_',' ')}${t.fecha_inicio?' · 📅 '+fdate(t.fecha_inicio):''}</div></div>`).join('')}
 ${me.es_organizador?`<div class=c><h3>Nuevo torneo</h3><input id=tn placeholder="Nombre"><input id=tc placeholder="Categoría (ej. 5ta)">
 <select id=tf><option value=grupos>Fase de grupos</option><option value=eliminacion_directa>Eliminación directa</option></select>
 <label class=mut>Fecha de inicio</label><input id=tdt type=date>${fmtFields(DEF)}
 <button class="p w" data-a=newT>Crear torneo</button></div>`:'<p class=mut>Solo los organizadores habilitados pueden crear torneos.</p>'}`}

function vRank(){return `<h2>Ranking</h2><p class=mut>El puntaje inicial es 1200. Cambia al cerrar partidos según el resultado esperado entre ambas parejas: una victoria ante rivales más fuertes suma más, y perder ante rivales menos fuertes resta más. La cifra pequeña muestra victorias / partidos jugados.</p><div class=c>${Object.values(J).sort((a,b)=>b.elo_actual-a.elo_actual).map((j,i)=>
 `<div class="row sp" style="padding:6px 0"><span class=row style="flex-wrap:nowrap">${i+1}. ${av(j.id,'s')} ${esc(nm(j.id))}</span><span><b>${j.elo_actual}</b> <span class=mut>${j.partidos_ganados}/${j.partidos_jugados}</span></span></div>`).join('')}</div>`}

function vScore(){const m=M[score.id],c=cfgOf(m),s=calc(score.evs,c),on=m.estado=='en_progreso',fin=s.w!=null;
 const team=eq=>`<div class="team T${eq}"><h3>${esc(pn(eq=='A'?m.pareja_a_id:m.pareja_b_id))}</h3>
  <button data-a=pick data-t=winner data-e=${eq} ${on&&!fin?'':'disabled'}>🏆 Winner</button>
  <button data-a=pick data-t=error_no_forzado data-e=${eq} ${on&&!fin?'':'disabled'}>❌ Error rival</button>
  <button data-a=add data-t=punto_general data-e=${eq} ${on&&!fin?'':'disabled'}>＋ Punto</button></div>`;
 let sheet='';
 if(pick){const side=pick.t=='winner'?pick.e:(pick.e=='A'?'B':'A'),ids=pl(side=='A'?m.pareja_a_id:m.pareja_b_id);
  sheet=`<div class=sheet data-a=cancel><div><h3>${pick.t=='winner'?'¿Quién hizo el winner?':'¿Quién cometió el error?'}</h3>
  ${ids.map(j=>`<button data-a=add data-t=${pick.t} data-e=${pick.e} data-j=${j}>${av(j,'s')} ${esc(nm(j))}</button>`).join('')}</div></div>`}
 return `<div class=row sp><button data-a=back>‹ Salir</button><span class=mut>${esc(T[m.torneo_id]?.nombre)} · ${m.fase}</span></div>
 <div class=sc><div class=sets>${s.sets.map(x=>`<span class=tag>${x.join('-')}</span>`).join('')}</div>
 <div class=big>${s.g[0]} - ${s.g[1]}</div><h2>${pts(s,c)}</h2>${(!s.tb&&!s.stb&&s.w==null&&(s.gold||((s.dec||gm(c)=='oro')&&s.p[0]==3&&s.p[1]==3)))?'<div class=tag style="background:#c9a24b;color:#fff">★ PUNTO DE ORO</div>':''}${s.dec?'<div class=mut>Último juego (3-3) · punto de oro</div>':''}${s.stb?'<div class=mut>Súper tie-break</div>':s.tb?'<div class=mut>Tie-break</div>':''}<div class=mut>${fmtTxt(c)}</div></div>
 ${m.estado=='pendiente'?`<div class=ban>El partido no empezó<br><button class="p w" data-a=start>▶ Comenzar partido</button></div>`:''}
 ${fin?`<div class=ban>🏁 Ganó ${esc(pn(s.w==0?m.pareja_a_id:m.pareja_b_id))} (${sets_(s)})<br><button class="p w" data-a=close>Cerrar partido y actualizar puntaje</button></div>`:''}
 <div class=teams>${team('A')}${team('B')}</div><div style="height:70px"></div>
 <div class=bar><button class=d data-a=undo ${score.evs.length?'':'disabled'}>↩ Deshacer</button></div>${sheet}`}

function render(){
 if(!me){A.innerHTML=vLogin();return}
 if(score){A.innerHTML=vScore();return}
 A.innerHTML=`<div class="row sp"><span class=row data-a=foto style="cursor:pointer;flex-wrap:nowrap">${av(me.id)}<span class=mut>${esc(me.nombre)} · Puntaje ${me.elo_actual}<br>Tocá tu foto para cambiarla</span></span><input id=ff type=file accept="image/*" hidden><span class=row style="gap:6px;flex-wrap:nowrap"><button data-a=nombre>✏️ Mi nombre</button><button data-a=out>Salir</button></span></div>`+
 inv()+invPareja()+(tab=='partidos'?vPartidos():tab=='torneos'?vTorneos():vRank())+
 `<nav>${[['partidos','🎾 Partidos'],['torneos','🏆 Torneos'],['rank','📊 Ranking']].map(([k,l])=>`<button class="${tab==k?'on':''}" data-a=tab data-v=${k}>${l}</button>`).join('')}</nav>`+(ed?vEd():'')}

/* ---------- Acciones ---------- */
const err=r=>{if(r.error){alert(r.error.message);return true}};
async function openScore(id){const r=await sb.from('estadisticas_eventos').select('*').eq('partido_id',id).order('id');
 score={id,evs:r.data||[]}}
function fixture(t){
 const ps=Object.values(P).filter(p=>p.torneo_id==t.id).sort(()=>Math.random()-.5),mk=o=>({id:crypto.randomUUID(),torneo_id:t.id,fase:'grupos',grupo:null,numero:null,pareja_a_id:null,pareja_b_id:null,siguiente_partido_id:null,siguiente_slot:null,...o});
 if(ps.length<2||ps.some(p=>!p.jugador_2_id||!p.confirmada)){alert('Hacen falta al menos 2 parejas, todas completas y con el compañero ya confirmado (aceptó la invitación).');return null}
 const rows=[];
 if(t.formato=='grupos'){const n=t.parejas_por_grupo,g=[];for(let i=0;i<ps.length;i+=n)g.push(ps.slice(i,i+n));
  if(g.length>1&&g[g.length-1].length<2)g[g.length-2].push(...g.pop());
  let k=1;g.forEach((gr,gi)=>{for(let i=0;i<gr.length;i++)for(let j=i+1;j<gr.length;j++)rows.push(mk({grupo:String.fromCharCode(65+gi),numero:k++,pareja_a_id:gr[i].id,pareja_b_id:gr[j].id}))})}
 else{const n=ps.length,nm={2:'final',4:'semifinal',8:'cuartos',16:'octavos'};
  if(!nm[n]){alert('Eliminación directa necesita 2, 4, 8 o 16 parejas (hay '+n+').');return null}
  const R=[];for(let m=n/2;m>=1;m/=2)R.push(Array.from({length:m},(_,i)=>mk({fase:nm[m*2],numero:i+1})));
  R[0].forEach((r,i)=>{r.pareja_a_id=ps[2*i].id;r.pareja_b_id=ps[2*i+1].id});
  R.forEach((rd,ri)=>{if(ri<R.length-1)rd.forEach((r,i)=>{r.siguiente_partido_id=R[ri+1][i>>1].id;r.siguiente_slot=i%2?'B':'A'})});
  rows.push(...R.flat())}
 return rows}

document.addEventListener('click',e=>{const b=e.target.closest('#togglePw');if(!b)return;const i=$('#pw'),visible=i.type=='password';i.type=visible?'text':'password';b.classList.toggle('is-visible',visible);b.setAttribute('aria-pressed',String(visible));b.setAttribute('aria-label',visible?'Ocultar contraseña':'Mostrar contraseña');i.focus()});

document.addEventListener('change',async e=>{if(e.target.id!='ff'||!e.target.files[0])return;const f=e.target.files[0];
 try{const bmp=await createImageBitmap(f),n=256,c=document.createElement('canvas');c.width=c.height=n;
  const m=Math.min(bmp.width,bmp.height);c.getContext('2d').drawImage(bmp,(bmp.width-m)/2,(bmp.height-m)/2,m,m,0,0,n,n);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85)),path=me.id+'/avatar.jpg';
  const u=await sb.storage.from('avatares').upload(path,blob,{upsert:true,contentType:'image/jpeg'});if(u.error)throw u.error;
  const url=sb.storage.from('avatares').getPublicUrl(path).data.publicUrl+'?v='+Date.now();
  const r=await sb.from('jugadores').update({foto_url:url}).eq('id',me.id);if(r.error)throw r.error;
  await load();render()}catch(x){alert('No se pudo subir la foto: '+(x.message||x))}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 if(e.target.closest('.sheet>div')&&b.dataset.a=='cancel')return;
 const d=b.dataset,a=d.a;
 if(a=='foto'){$('#ff').click();return}
 try{
 if(a=='login'){const r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(err(r))return;await load()}
 else if(a=='signup'){const r=await sb.auth.signUp({email:$('#em').value.trim(),password:$('#pw').value,options:{data:{nombre:$('#nm').value.trim()}}});
  if(r.error){msg=r.error.message}else if(!r.data.session){msg='Cuenta creada. Revisá tu email para confirmarla y luego entrá.'}else await load()}
 else if(a=='out'){await sb.auth.signOut();me=null}
 else if(a=='tab'){tab=d.v;sel=null}
 else if(a=='open'){sel=d.id}
 else if(a=='back'){if(score){score=null;await load()}else sel=null}
 else if(a=='newT'){const r=await sb.from('torneos').insert({nombre:$('#tn').value.trim(),categoria:$('#tc').value.trim()||'General',formato:$('#tf').value,fecha_inicio:$('#tdt').value||null,config:readFmt(),organizador_id:me.id});if(err(r))return;await load()}
 else if(a=='join'){const em=$('#cp').value.trim();let c=null;
  if(em){const f=byEmail(em);if(!f){alert('Ese email no está registrado en la app. Pedile a tu compañero que cree su cuenta con ese email y volvé a intentar.');return}
   if(f.id==me.id){alert('Ese es tu propio email.');return}c=f.id}
  const r=await sb.from('parejas_inscritas').insert({torneo_id:sel,jugador_1_id:me.id,jugador_2_id:c});if(err(r))return;await load();
  if(c)alert('Listo. '+nm(c)+' tiene que aceptar la invitación desde su cuenta.')}
 else if(a=='gen'){const rows=fixture(T[sel]);if(!rows)return;
  const r=await sb.from('partidos_fixture').insert(rows);if(err(r))return;
  await sb.from('torneos').update({estado:'en_progreso'}).eq('id',sel);await load()}
 else if(a=='propMake'){const a1=$('#pairA').value,b1=$('#pairB').value;if(!a1||!b1||a1==b1){alert('Elegí dos inscriptos distintos.');return}
  const r=await sb.rpc('proponer_pareja_organizador',{p_pareja_origen_id:a1,p_pareja_invitada_id:b1});if(err(r))return;await load()}
 else if(a=='propAccept'||a=='propReject'){const r=await sb.rpc('responder_propuesta_pareja',{p_propuesta_id:d.id,p_aceptar:a=='propAccept'});if(err(r))return;await load()}
 else if(a=='propCancel'){const r=await sb.rpc('cancelar_propuesta_pareja',{p_propuesta_id:d.id});if(err(r))return;await load()}
 else if(a=='acc'){const r=await sb.from('parejas_inscritas').update({confirmada:true}).eq('id',d.id);if(err(r))return;await load()}
 else if(a=='rej'){if(!confirm('¿Rechazar la invitación?'))return;const r=await sb.from('parejas_inscritas').update({jugador_2_id:null}).eq('id',d.id);if(err(r))return;await load()}
 else if(a=='edT'){ed={k:'T',id:sel}}
 else if(a=='edM'){ed={k:'M',id:d.id}}
 else if(a=='closeEd'){ed=null}
 else if(a=='resetEd'){const r=await sb.from('partidos_fixture').update({config:null}).eq('id',ed.id);if(err(r))return;ed=null;await load()}
 else if(a=='saveEd'){const r=ed.k=='T'?await sb.from('torneos').update({config:readFmt(),fecha_inicio:$('#fdt').value||null}).eq('id',ed.id):await sb.from('partidos_fixture').update({config:readFmt()}).eq('id',ed.id);if(err(r))return;ed=null;await load()}
 else if(a=='nombre'){const v=prompt('Tu nombre y apellido (así se verá en los partidos):',me.nombre);if(v===null)return;
  const n=v.trim().replace(/\s+/g,' ');if(!n)return;
  if(n.length>80){alert('El nombre es demasiado largo (máximo 80 letras).');return}
  if(n.split(' ').length<2&&!confirm('Tiene una sola palabra. Se recomienda "Nombre Apellido" (por ejemplo: Marcelo Carrizo). ¿Guardar igual?'))return;
  const r=await sb.from('jugadores').update({nombre:n}).eq('id',me.id);if(err(r))return;await load()}
 else if(a=='des'){const v=prompt('Email del jugador registrado que va a anotar (vacío = yo):');if(v===null)return;
  let id=me.id;if(v.trim()){const f=byEmail(v);if(!f){alert('No hay ningún jugador registrado con ese email.');return}id=f.id}
  const r=await sb.from('partidos_fixture').update({anotador_id:id}).eq('id',d.id);if(err(r))return;await load()}
 else if(a=='score'){await openScore(d.id)}
 else if(a=='start'){const r=await sb.from('partidos_fixture').update({estado:'en_progreso'}).eq('id',score.id);if(err(r))return;await load();await openScore(score.id)}
 else if(a=='pick'){pick={t:d.t,e:d.e}}
 else if(a=='cancel'){pick=null}
 else if(a=='add'){pick=null;const c=cfgOf(M[score.id]),s=calc(score.evs,c);if(s.w!=null)return;
  const n=calc(score.evs.concat([{equipo_que_suma:d.e}]),c),
  r=await sb.from('estadisticas_eventos').insert({partido_id:score.id,tipo_evento:d.t,jugador_id:d.j||null,equipo_que_suma:d.e,marcador_momento:txt(n,c)});if(err(r))return;await openScore(score.id)}
 else if(a=='undo'){const l=score.evs[score.evs.length-1];const r=await sb.from('estadisticas_eventos').delete().eq('id',l.id);if(err(r))return;await openScore(score.id)}
 else if(a=='close'){const m=M[score.id],s=calc(score.evs,cfgOf(m));
  const r=await sb.from('partidos_fixture').update({estado:'finalizado',resultado_sets:sets_(s),pareja_ganadora_id:s.w==0?m.pareja_a_id:m.pareja_b_id}).eq('id',m.id);
  if(err(r))return;score=null;await load()}
 }catch(x){alert(x.message)}
 render()});

sb.auth.onAuthStateChange((ev)=>{if(ev=='SIGNED_OUT'){me=null;render()}});
load().then(render);
